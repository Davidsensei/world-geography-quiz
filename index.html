<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Geography Quiz</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3f8;
  color: #1e293b;
}
header {
  background: #17365d;
  color: white;
  text-align: center;
  padding: 25px 15px;
}
header h1 { margin: 0 0 8px; }
header p { margin: 0; color: #dbeafe; }
main {
  max-width: 650px;
  margin: 30px auto;
  padding: 20px;
}
.panel {
  background: white;
  border-radius: 16px;
  padding: 25px;
  box-shadow: 0 4px 18px #00000012;
}
.stats {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 20px;
  text-align: center;
}
.stat {
  background: #eef3f8;
  border-radius: 10px;
  padding: 12px;
  flex: 1;
}
.stat strong { display: block; font-size: 23px; }
.stat span { font-size: 12px; color: #64748b; }
.progress {
  height: 9px;
  background: #e2e8f0;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 25px;
}
#progressBar {
  height: 100%;
  width: 0;
  background: #16a34a;
  transition: width .2s;
}
.question-label {
  color: #64748b;
  font-size: 14px;
  text-align: center;
}
h2 { text-align: center; font-size: 27px; }
#question { margin: 15px 0 25px; }
.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
button {
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
}
.answer {
  background: #e8eef6;
  color: #17365d;
  border: 2px solid transparent;
}
.answer:hover:not(:disabled) {
  border-color: #3975b9;
  background: #dceafe;
}
.answer:disabled { cursor: default; opacity: 1; }
.answer.correct { background: #dcfce7; border-color: #16a34a; color: #166534; }
.answer.wrong { background: #fee2e2; border-color: #dc2626; color: #991b1b; }
#feedback {
  min-height: 30px;
  text-align: center;
  font-weight: bold;
  margin: 20px 0 5px;
}
.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 15px;
}
.primary { background: #17365d; color: white; }
.secondary { background: #e2e8f0; color: #334155; }
button:disabled { opacity: .5; cursor: not-allowed; }
#nextButton { display: none; }
#summary { display: none; text-align: center; }
#summary h2 { color: #17365d; }
.small { font-size: 13px; color: #64748b; text-align: center; }
@media(max-width: 480px) {
  main { padding: 12px; margin: 15px auto; }
  .panel { padding: 18px; }
  .answers { grid-template-columns: 1fr; }
  h2 { font-size: 23px; }
}
</style>
</head>
<body>

<header>
  <h1>🌍 World Geography Quiz</h1>
  <p>Explore the world, one country at a time!</p>
</header>

<main>
  <div class="panel" id="quizPanel">
    <div class="stats">
      <div class="stat">
        <strong id="questionNumber">1/20</strong>
        <span>QUESTION</span>
      </div>
      <div class="stat">
        <strong id="score">0</strong>
        <span>SCORE</span>
      </div>
      <div class="stat">
        <strong id="accuracy">—</strong>
        <span>FIRST TRY</span>
      </div>
    </div>

    <div class="progress"><div id="progressBar"></div></div>
<div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;">

  <label style="flex:1; min-width:130px;">
    Continent
    <select id="continent" style="width:100%; padding:10px; margin-top:6px; border-radius:8px;">
      <option value="All">All World</option>
      <option value="Africa">Africa</option>
      <option value="Asia">Asia</option>
      <option value="Europe">Europe</option>
      <option value="North America">North America</option>
      <option value="South America">South America</option>
      <option value="Oceania">Oceania</option>
    </select>
  </label>
</div>
    <p class="question-label">CAPITAL CITIES</p>
    <h2 id="question">What is the capital of Japan?</h2>

    <div class="answers" id="answers"></div>

    <div id="feedback"></div>

    <div class="controls">
      <button class="secondary" id="speakButton">🔊 Hear question</button>
      <button class="secondary" id="soundButton">🔈 Sound: On</button>
      <button class="primary" id="nextButton">Next question →</button>
    </div>
  </div>

  <div class="panel" id="summary">
    <h2>🎉 Session complete!</h2>
    <p id="finalScore"></p>
    <p id="finalAccuracy"></p>
    <h3>Countries to practise</h3>
    <p id="practiceList"></p>
    <button class="primary" onclick="startQuiz()">Play again</button>
  </div>

  <p class="small">Your progress is saved on this device.</p>
</main>

<script>
const countries = [
  {name:"Japan",capital:"Tokyo",continent:"Asia",cities:["Osaka","Kyoto","Yokohama","Sapporo"]},
  {name:"Australia",capital:"Canberra",continent:"Oceania",cities:["Sydney","Melbourne","Brisbane","Perth"]},
  {name:"France",capital:"Paris",continent:"Europe",cities:["Lyon","Marseille","Nice","Bordeaux"]},
  {name:"Germany",capital:"Berlin",continent:"Europe",cities:["Munich","Hamburg","Frankfurt","Cologne"]},
  {name:"Italy",capital:"Rome",continent:"Europe",cities:["Milan","Venice","Florence","Naples"]},
  {name:"Spain",capital:"Madrid",continent:"Europe",cities:["Barcelona","Seville","Valencia","Malaga"]},
  {name:"United Kingdom",capital:"London",continent:"Europe",cities:["Manchester","Liverpool","Birmingham","Edinburgh"]},
  {name:"Canada",capital:"Ottawa",continent:"North America",cities:["Toronto","Vancouver","Montreal","Calgary"]},
  {name:"United States",capital:"Washington, D.C.",continent:"North America",cities:["New York","Los Angeles","Chicago","Miami"]},
  {name:"Mexico",capital:"Mexico City",continent:"North America",cities:["Guadalajara","Monterrey","Cancun","Puebla"]},
  {name:"Brazil",capital:"Brasília",continent:"South America",cities:["Rio de Janeiro","Sao Paulo","Salvador","Manaus"]},
  {name:"Argentina",capital:"Buenos Aires",continent:"South America",cities:["Cordoba","Rosario","Mendoza","La Plata"]},
  {name:"Egypt",capital:"Cairo",continent:"Africa",cities:["Alexandria","Giza","Luxor","Aswan"]},
  {name:"South Africa",capital:"Pretoria",continent:"Africa",cities:["Cape Town","Johannesburg","Durban","Bloemfontein"]},
  {name:"Kenya",capital:"Nairobi",continent:"Africa",cities:["Mombasa","Kisumu","Nakuru","Eldoret"]},
  {name:"China",capital:"Beijing",continent:"Asia",cities:["Shanghai","Guangzhou","Shenzhen","Chengdu"]},
  {name:"India",capital:"New Delhi",continent:"Asia",cities:["Mumbai","Bengaluru","Kolkata","Chennai"]},
  {name:"South Korea",capital:"Seoul",continent:"Asia",cities:["Busan","Incheon","Daegu","Daejeon"]},
  {name:"Thailand",capital:"Bangkok",continent:"Asia",cities:["Chiang Mai","Phuket","Pattaya","Hat Yai"]},
  {name:"New Zealand",capital:"Wellington",continent:"Oceania",cities:["Auckland","Christchurch","Hamilton","Dunedin"]}
];

const SESSION_LENGTH = 20;
let questions = [];
let current = 0;
let score = 0;
let firstTryCorrect = 0;
let firstTryCount = 0;
let firstAttempt = true;
let soundOn = true;
let practice = [];

let progress = JSON.parse(localStorage.getItem("geoProgress") || "{}");

function speak(text) {
  if (!soundOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const message = new SpeechSynthesisUtterance(text);
  message.lang = "en-US";
  message.rate = 0.9;
  speechSynthesis.speak(message);
}

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function chooseQuestions(pool) {
  const selected = [];
  const remaining = [...pool];

  // First, use every available country once, without repeats.
  while (remaining.length > 0 && selected.length < SESSION_LENGTH) {
    const weighted = [];

    remaining.forEach(country => {
      const level = progress[country.name] || 0;
      const weight = level >= 3 ? 1 : level === 2 ? 2 : 4;

      for (let i = 0; i < weight; i++) {
        weighted.push(country);
      }
    });

    const chosen = weighted[Math.floor(Math.random() * weighted.length)];
    selected.push(chosen);
    remaining.splice(remaining.indexOf(chosen), 1);
  }

  // If there are fewer than 20 countries, start another round.
  while (selected.length < SESSION_LENGTH) {
    let choices = pool;

    if (pool.length > 1) {
      choices = pool.filter(
        country => country.name !== selected[selected.length - 1].name
      );
    }

    const weighted = [];

    choices.forEach(country => {
      const level = progress[country.name] || 0;
      const weight = level >= 3 ? 1 : level === 2 ? 2 : 4;

      for (let i = 0; i < weight; i++) {
        weighted.push(country);
      }
    });

    selected.push(weighted[Math.floor(Math.random() * weighted.length)]);
  }

  return selected;
}

function makeAnswers(country) {
  const answers = [country.capital];

  const sameCountryCities = shuffle(
    country.cities.filter(city => city !== country.capital)
  );

  const otherCapitals = shuffle(
    countries
      .filter(c => c.name !== country.name)
      .map(c => c.capital)
  );

  // Randomly choose one of three answer patterns.
  const pattern = Math.floor(Math.random() * 3);

  let localCount;

  if (pattern === 0) {
    localCount = 3;
  } else if (pattern === 1) {
    localCount = 0;
  } else {
    localCount = Math.random() < 0.5 ? 1 : 2;
  }

  // Add cities from the correct country.
  answers.push(...sameCountryCities.slice(0, localCount));

  // Fill the remaining spaces with capitals from other countries.
  for (const capital of otherCapitals) {
    if (answers.length >= 4) break;
    if (!answers.includes(capital)) {
      answers.push(capital);
    }
  }

  // Fill any remaining spaces if needed.
  for (const city of sameCountryCities) {
    if (answers.length >= 4) break;
    if (!answers.includes(city)) {
      answers.push(city);
    }
  }

  return shuffle(answers);
}

function startQuiz() {
  const selectedContinent = document.getElementById("continent").value;

  const pool = selectedContinent === "All"
    ? countries
    : countries.filter(c => c.continent === selectedContinent);

  if (pool.length === 0) {
    alert("No countries available for this continent yet.");
    return;
  }

  questions = chooseQuestions(pool);

  current = 0;
  score = 0;
  firstTryCorrect = 0;
  firstTryCount = 0;
  practice = [];

  document.getElementById("quizPanel").style.display = "block";
  document.getElementById("summary").style.display = "none";

  showQuestion();
}

function showQuestion() {
  firstAttempt = true;
  const country = questions[current];

  document.getElementById("questionNumber").textContent =
    `${current + 1}/${questions.length}`;

  document.getElementById("score").textContent = score;

  document.getElementById("accuracy").textContent =
    firstTryCount
      ? Math.round(firstTryCorrect / firstTryCount * 100) + "%"
      : "—";

  document.getElementById("progressBar").style.width =
    (current / questions.length * 100) + "%";

  document.getElementById("question").textContent =
    `What is the capital of ${country.name}?`;

  document.getElementById("feedback").textContent = "";
  document.getElementById("nextButton").style.display = "none";

  const answerArea = document.getElementById("answers");
  answerArea.innerHTML = "";

  makeAnswers(country).forEach(option => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = option;
    button.onclick = () => checkAnswer(button, option, country);
    answerArea.appendChild(button);
  });

  speak(`What is the capital of ${country.name}?`);
}
function checkAnswer(button, answer, country) {
  const correct = answer === country.capital;

  // Record the first attempt only.
  if (firstAttempt) {
    firstTryCount++;

    if (correct) {
      firstTryCorrect++;

      // Improve this country's progress.
      progress[country.name] = Math.min(
        3,
        (progress[country.name] || 0) + 1
      );
    } else {
      // Remember this country for extra practice.
      if (!practice.includes(country.name)) {
        practice.push(country.name);
      }

      // Reduce progress when an answer is incorrect.
      progress[country.name] = Math.max(
        0,
        (progress[country.name] || 0) - 1
      );
    }

    firstAttempt = false;

    localStorage.setItem("geoProgress", JSON.stringify(progress));
  }

  if (correct) {
    button.classList.add("correct");
    score++;

    document.getElementById("score").textContent = score;
    document.getElementById("feedback").textContent =
      `Correct! ${country.capital} is the capital of ${country.name}.`;

    document.querySelectorAll(".answer").forEach(btn => {
      btn.disabled = true;
    });

    document.getElementById("nextButton").style.display = "inline-block";

    speak(`Correct! The capital of ${country.name} is ${country.capital}.`);

  } else {
    button.classList.add("wrong");
    button.disabled = true;

    document.getElementById("feedback").textContent =
      `Not quite! The correct answer is ${country.capital}. Try again!`;

    speak(`Not quite. The answer is ${country.capital}. Try again.`);
  }

  document.getElementById("accuracy").textContent =
    Math.round(firstTryCorrect / firstTryCount * 100) + "%";
}

function nextQuestion() {
  current++;

  if (current >= questions.length) {
    endQuiz();
  } else {
    showQuestion();
  }
}

function endQuiz() {
  document.getElementById("quizPanel").style.display = "none";
  document.getElementById("summary").style.display = "block";

  document.getElementById("finalScore").textContent =
    `Your score: ${score}/${questions.length}`;

  document.getElementById("finalAccuracy").textContent =
    `First-attempt accuracy: ${
      Math.round(firstTryCorrect / firstTryCount * 100)
    }%`;

  document.getElementById("practiceList").textContent =
    practice.length > 0
      ? practice.join(", ")
      : "Excellent! No countries to practise.";

  document.getElementById("progressBar").style.width = "100%";

  speak("Quiz complete! Well done!");
}

// Connect the buttons.
document.getElementById("nextButton").addEventListener(
  "click",
  nextQuestion
);

document.getElementById("speakButton").addEventListener(
  "click",
  () => {
    const country = questions[current];
    speak(`What is the capital of ${country.name}?`);
  }
);

document.getElementById("soundButton").addEventListener(
  "click",
  () => {
    soundOn = !soundOn;

    document.getElementById("soundButton").textContent =
      soundOn ? "🔈 Sound: On" : "🔇 Sound: Off";

    if (!soundOn) {
      speechSynthesis.cancel();
    }
  }
);

document.getElementById("continent").addEventListener(
  "change",
  startQuiz
);
startQuiz();
</script>
</body>
</html>
